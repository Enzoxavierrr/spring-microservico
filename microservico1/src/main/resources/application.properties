# Versão para https, execução em um único processo
#    containerizado com docker. Cada microserviço tem sua
#    porta definida no arquivo application.properties.
server.port: 443
server.ssl.key-store: keystore.p12
server.ssl.key-store-password: springboot
server.ssl.keyStoreType: PKCS12
server.ssl.keyAlias: tomcat

spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:postgresql://banco:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.enabled=true
